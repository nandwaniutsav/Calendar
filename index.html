  let matHTML='—';
  if(mats.length)matHTML=`<table class="mat-table"><thead><tr><th>${T('Item / Description')}</th><th>${T('Qty')}</th><th>${T('Unit')}</th></tr></thead><tbody>${mats.map(m=>`<tr><td>${m.item}</td><td>${m.qty||'—'}</td><td>${m.unit||'—'}</td></tr>`).join('')}</tbody></table>`;
  const proj=j.projectId?projById(j.projectId):null;
  document.getElementById('jobDetailTitle').innerHTML=`<span style="color:${col}">${j.jobType}</span>`;
  document.getElementById('jobDetailBody').innerHTML=`
    <div class="jdr"><div class="jdr-k">${T('Team')}</div><div class="jdr-v">${teamHTML}</div></div>
    ${proj?`<div class="jdr"><div class="jdr-k">${T('Project')}</div><div class="jdr-v" style="font-weight:700;color:var(--gold)">📁 ${proj.name}</div></div>`:''}
    <div class="jdr"><div class="jdr-k">${T('Customer')}</div><div class="jdr-v">${j.customer}</div></div>
    <div class="jdr"><div class="jdr-k">${T('Phone')}</div><div class="jdr-v">${j.phone||'—'}</div></div>
    <div class="jdr"><div class="jdr-k">${T('Address')}</div><div class="jdr-v">${j.address}</div></div>
    <div class="jdr"><div class="jdr-k">${T('Date')}</div><div class="jdr-v">${fmtDate(j.date)}</div></div>
    <div class="jdr"><div class="jdr-k">${T('Time')}</div><div class="jdr-v">${fmtTime(j.startTime)} – ${fmtTime(j.endTime)}</div></div>
    <div class="jdr"><div class="jdr-k">${T('Materials')}</div><div class="jdr-v">${matHTML}</div></div>
    <div class="jdr"><div class="jdr-k">${T('Notes')}</div><div class="jdr-v">${j.notes||'—'}</div></div>`;
  document.getElementById('jobDetailOverlay').classList.add('open');
}
function editFromDetail(){closeModal('jobDetailOverlay');editJob(currentDetailJobId)}
function deleteFromDetail(){if(!confirm(T('Delete this job?')))return;jobs=jobs.filter(j=>j.id!==currentDetailJobId);saveData();toast(T('Deleted'),'info');closeModal('jobDetailOverlay');renderAll()}

/* ═══════════════════════════════════════════
   EMPLOYEES PAGE — colour-banded
═══════════════════════════════════════════ */
function renderEmpPage(){
  const td=ds(new Date());
  let html=`<div class="emp-page-hdr"><h2>${T('Employee Management')}</h2><button class="btn-primary" onclick="openEmpModal()">${T('+ Add Employee')}</button></div>`;
  Object.entries(COMPANIES).forEach(([k,c])=>{
    const ce=employees.filter(e=>e.company===k);
    html+=`<div class="co-section">
      <div class="co-hdr">
        <div class="co-bar" style="background:${c.color}"></div>
        <h3 style="color:${c.color}">${c.name}</h3>
        <span class="co-count">${ce.length} ${T('employees')}</span>
      </div>
      <div class="emp-cards">`;
    ce.forEach(e=>{
      const todayJobs=jobs.filter(j=>j.date===td&&(j.empIds||[]).includes(e.id));
      const busyToday=todayJobs.length>0;
      html+=`<div class="emp-card" style="border-left-color:${c.color}">
        <div class="emp-card-av" style="background:${c.color}">${e.name.slice(0,2).toUpperCase()}</div>
        <div class="emp-card-info">
          <div class="emp-card-name">${e.name}</div>
          <div class="emp-card-meta">${e.role||c.name}</div>
          ${busyToday?`<div style="font-size:.74rem;color:var(--terra);margin-top:4px;font-weight:700">📍 ${T('Out today')} (${todayJobs.length})</div>`:'<div style="font-size:.74rem;color:var(--green);margin-top:4px;font-weight:600">✓ Free</div>'}
        </div>
        <div class="emp-card-acts">
          <button class="icon-btn edit" onclick="openEmpModal('${e.id}')">✎</button>
          <button class="icon-btn" onclick="removeEmp('${e.id}')">✕</button>
        </div></div>`;
    });
    html+=`<div class="add-emp-card" onclick="openEmpModal(null,'${k}')"><span style="font-size:1.2rem">＋</span><span>${T('Add to')} ${c.name}</span></div></div></div>`;
  });
  document.getElementById('empPageContent').innerHTML=html;
}
function openEmpModal(id,pre){
  document.getElementById('editEmpId').value=id||'';
  if(id){const e=empById(id);document.getElementById('empModalTitle').textContent=T('Edit Employee');document.getElementById('empName').value=e.name;document.getElementById('empCompany').value=e.company;document.getElementById('empRole').value=e.role||''}
  else{document.getElementById('empModalTitle').textContent=T('Add Employee');document.getElementById('empName').value='';document.getElementById('empCompany').value=pre||'handloom';document.getElementById('empRole').value=''}
  document.getElementById('empModalOverlay').classList.add('open');
}
function saveEmployee(){
  const name=document.getElementById('empName').value.trim(),company=document.getElementById('empCompany').value,role=document.getElementById('empRole').value.trim();
  if(!name){toast(T('Enter employee name'),'error');return}
  const eid=document.getElementById('editEmpId').value;
  if(eid){const idx=employees.findIndex(e=>e.id===eid);if(idx>=0)employees[idx]={...employees[idx],name,company,role};toast(T('Updated'),'success')}
  else{employees.push({id:'e'+uid(),name,company,role});toast(T('Employee added'),'success')}
  saveData();closeModal('empModalOverlay');renderEmpPage();renderSidebarEmps();
}
function removeEmp(id){
  const e=empById(id);
  if(!confirm(lang==='en'?`Remove ${e?.name}?`:`${e?.name} को हटाएं?`))return;
  employees=employees.filter(e=>e.id!==id);saveData();toast(T('Removed'),'info');renderEmpPage();renderSidebarEmps();
}

/* ═══════════════════════════════════════════
   PROJECTS PAGE
═══════════════════════════════════════════ */
function renderProjPage(){
  let filtered=projects;
  if(projFilter==='active')filtered=projects.filter(p=>!p.closed);
  else if(projFilter==='closed')filtered=projects.filter(p=>p.closed);
  let html=`<div class="proj-page-hdr"><h2>${T('Projects')}</h2><button class="btn-primary" onclick="openProjModal()">${T('+ New Project')}</button></div>`;
  html+=`<div class="proj-tabs">
    <div class="ptab ${projFilter==='active'?'active':''}" onclick="projFilter='active';renderProjPage()">${T('Active')} (${projects.filter(p=>!p.closed).length})</div>
    <div class="ptab ${projFilter==='closed'?'active':''}" onclick="projFilter='closed';renderProjPage()">${T('Closed')} (${projects.filter(p=>p.closed).length})</div>
    <div class="ptab ${projFilter==='all'?'active':''}" onclick="projFilter='all';renderProjPage()">${T('All')} (${projects.length})</div>
  </div>`;
  if(!filtered.length){
    html+=`<div class="empty-state"><div class="e-icon">📁</div><h3>${T('No projects yet.')}</h3><p>${T('Create one to track multi-visit customers.')}</p></div>`;
  }else{
    html+=`<div class="proj-grid">`;
    filtered.forEach(p=>{
      const pjobs=jobs.filter(j=>j.projectId===p.id);
      const upcoming=pjobs.filter(j=>j.date>=ds(new Date())).length;
      html+=`<div class="proj-card ${p.closed?'closed':''}">
        <div class="proj-card-top">
          <h3>${p.name}</h3>
          <div class="proj-customer">👤 ${p.customer}${p.phone?` · 📞 ${p.phone}`:''}</div>
          <div class="proj-badges">
            <span class="proj-badge ${p.closed?'status-closed':'status-active'}">${p.closed?T('Closed'):T('Active')}</span>
            ${p.address?`<span class="proj-badge" style="background:var(--surface3);color:var(--muted2)">📍 ${p.address}</span>`:''}
          </div>
        </div>
        <div class="proj-card-body">
          <div class="proj-stat"><div class="n">${pjobs.length}</div><div class="l">${T('Total Jobs')}</div></div>
          <div class="proj-stat"><div class="n">${upcoming}</div><div class="l">${T('Upcoming')}</div></div>
          ${p.notes?`<div style="flex:1;font-size:var(--fs-xs);color:var(--muted2);line-height:1.5;padding-left:14px;border-left:1px solid var(--border)">${p.notes}</div>`:''}
        </div>
        <div class="proj-card-footer">
          <button class="btn-ghost btn-sm" onclick="openProjModal('${p.id}')">${T('Edit')}</button>
          ${!p.closed?`<button class="btn-ghost btn-sm" style="border-color:var(--terra);color:var(--terra)" onclick="closeProject('${p.id}')">${T('Close Project')}</button>`
          :`<button class="btn-ghost btn-sm" onclick="reopenProject('${p.id}')">${T('Reopen')}</button>`}
          <button class="btn-primary btn-sm" onclick="bookJobForProject('${p.id}')">${T('+ Job')}</button>
        </div>
      </div>`;
    });
    html+=`</div>`;
  }
  document.getElementById('projPageContent').innerHTML=html;
}
function openProjModal(id){
  document.getElementById('editProjId').value=id||'';
  if(id){const p=projById(id);document.getElementById('projModalTitle').textContent=T('Edit Project');document.getElementById('projName').value=p.name;document.getElementById('projCustomer').value=p.customer;document.getElementById('projPhone').value=p.phone||'';document.getElementById('projAddress').value=p.address||'';document.getElementById('projNotes').value=p.notes||''}
  else{document.getElementById('projModalTitle').textContent=T('New Project');['projName','projCustomer','projPhone','projAddress','projNotes'].forEach(id=>document.getElementById(id).value='')}
  document.getElementById('projModalOverlay').classList.add('open');
}
function saveProject(){
  const name=document.getElementById('projName').value.trim(),customer=document.getElementById('projCustomer').value.trim();
  if(!name||!customer){toast(T('Project name and customer required'),'error');return}
  const pid=document.getElementById('editProjId').value;
  const data={name,customer,phone:document.getElementById('projPhone').value.trim(),address:document.getElementById('projAddress').value.trim(),notes:document.getElementById('projNotes').value.trim()};
  if(pid){const idx=projects.findIndex(p=>p.id===pid);if(idx>=0)projects[idx]={...projects[idx],...data};toast(T('Project updated'),'success')}
  else{projects.push({id:'p'+uid(),closed:false,...data});toast(T('Project created'),'success')}
  saveData();closeModal('projModalOverlay');renderProjPage();
}
function closeProject(id){
  if(!confirm(lang==='en'?'Close this project?':'यह प्रोजेक्ट बंद करें?'))return;
  const idx=projects.findIndex(p=>p.id===id);if(idx>=0)projects[idx].closed=true;
  saveData();toast(T('Project closed'),'info');renderProjPage();
}
function reopenProject(id){
  const idx=projects.findIndex(p=>p.id===id);if(idx>=0)projects[idx].closed=false;
  saveData();toast(T('Project reopened'),'success');renderProjPage();
}
function bookJobForProject(projId){
  switchMain('calendar');
  setTimeout(()=>{openJobModal();document.getElementById('jobProject').value=projId},150);
}

/* ═══════════════════════════════════════════
   REPORT / EMAIL PAGE
═══════════════════════════════════════════ */
function renderEmailPage(){
  const today=ds(new Date());
  document.getElementById('emailPageContent').innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:14px">
      <h2>${T('Daily Report')}</h2>
      <div style="display:flex;align-items:center;gap:9px">
        <button class="nav-btn" onclick="reportNavDay(-1)">‹</button>
        <input class="form-input" type="date" id="reportDate" value="${today}" style="max-width:195px" onchange="refreshReport()">
        <button class="nav-btn" onclick="reportNavDay(1)">›</button>
        <button class="today-btn" onclick="document.getElementById('reportDate').value='${today}';refreshReport()">${T('Today')}</button>
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-bottom:28px;flex-wrap:wrap">
      <button class="btn-primary" onclick="printReport()">🖨 ${T('Print')}</button>
      <button class="btn-ghost" onclick="copyReport()">📋 ${T('Copy Text')}</button>
    </div>
    <div id="reportCards"></div>`;
  refreshReport();
}

function reportNavDay(dir){
  const el=document.getElementById('reportDate');if(!el)return;
  const d=new Date(el.value+'T00:00:00');d.setDate(d.getDate()+dir);
  el.value=ds(d);refreshReport();
}

function refreshReport(){
  const d2=document.getElementById('reportDate')?.value;if(!d2)return;
  const d=new Date(d2+'T00:00:00');
  const dj=jobs.filter(j=>j.date===d2).sort((a,b)=>a.startTime.localeCompare(b.startTime));
  const dateLabel=d.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  let html=`<div style="background:var(--surface);border:1.5px solid var(--border2);border-radius:var(--radius);padding:24px 28px;margin-bottom:20px">
    <div style="font-family:'Literata',serif;font-size:var(--fs-xl);color:var(--text);margin-bottom:5px">Nandwani Group — ${T('Daily Report')}</div>
    <div style="font-size:var(--fs-base);color:var(--muted2)">${dateLabel}</div>
    <div style="margin-top:14px;background:var(--surface2);border-radius:var(--radius-sm);padding:13px 17px;font-size:var(--fs-base);color:var(--text2);font-weight:600">
      ${dj.length?`${dj.length} ${T('jobs')} ${lang==='hi'?'शेड्यूल है':'scheduled'}`:`<span style="color:var(--muted);font-weight:400">${lang==='hi'?'इस दिन कोई काम नहीं।':'No jobs scheduled for this day.'}</span>`}
    </div>
  </div>`;
  if(dj.length){
    const byC={};
    dj.forEach(j=>{const co=(empById((j.empIds||[])[0])?.company)||'handloom';if(!byC[co])byC[co]=[];byC[co].push(j)});
    Object.entries(byC).forEach(([co,cj])=>{
      const c=COMPANIES[co];
      html+=`<div style="margin-bottom:26px">
        <div style="font-family:'Literata',serif;font-size:var(--fs-lg);color:white;background:${c.color};padding:10px 18px;border-radius:var(--radius-sm);margin-bottom:14px;font-weight:600">${c.name}</div>`;
      cj.forEach(j=>{
        const names=(j.empIds||[]).map(id=>empById(id)?.name||'?').join(' + ');
        const mats=parseMats(j.materials||'');
        const proj=j.projectId?projById(j.projectId):null;
        html+=`<div style="background:var(--surface);border:1.5px solid var(--border);border-left:5px solid ${c.color};border-radius:var(--radius-sm);padding:17px 20px;margin-bottom:13px">
          <div style="font-size:var(--fs-xs);color:${c.color};font-family:'JetBrains Mono',monospace;margin-bottom:7px;font-weight:700">${fmtTime(j.startTime)} – ${fmtTime(j.endTime)}</div>
          <div style="font-size:var(--fs-lg);font-weight:800;color:var(--text);margin-bottom:11px">${names} — ${j.jobType}</div>
          <div style="display:flex;flex-direction:column;gap:6px;font-size:var(--fs-base);color:var(--text2)">
            <div>👤 <strong>${j.customer}</strong>${j.phone?` &nbsp;·&nbsp; 📞 ${j.phone}`:''}</div>
            <div>📍 ${j.address}</div>
            ${proj?`<div style="color:var(--gold);font-weight:600">📁 ${proj.name}</div>`:''}
            ${mats.length?`<div style="margin-top:8px;font-size:var(--fs-sm);color:var(--muted2)">📦 ${mats.map(m=>`${m.item}${m.qty?' × '+m.qty:''}${m.unit?' '+m.unit:''}`).join(' &nbsp;|&nbsp; ')}</div>`:''}
            ${j.notes?`<div style="margin-top:6px;font-size:var(--fs-sm);color:var(--muted);font-style:italic">📝 ${j.notes}</div>`:''}
          </div>
        </div>`;
      });
      html+=`</div>`;
    });
  }
  document.getElementById('reportCards').innerHTML=html;
}

function genEmailBody(targetDate){
  const d2=ds(targetDate),dj=jobs.filter(j=>j.date===d2).sort((a,b)=>a.startTime.localeCompare(b.startTime));
  const dl=targetDate.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  if(!dj.length)return`Nandwani Group — Daily Schedule\n${'─'.repeat(40)}\n\nDate: ${dl}\n\nNo jobs scheduled.\n\n— Nandwani Job Scheduler`;
  let body=`Nandwani Group — Daily Schedule\n${'─'.repeat(40)}\n\nDate: ${dl}\nTotal Jobs: ${dj.length}\n\n`;
  const byC={};dj.forEach(j=>{const co=(empById((j.empIds||[])[0])?.company)||'handloom';if(!byC[co])byC[co]=[];byC[co].push(j)});
  Object.entries(byC).forEach(([co,cj])=>{
    body+=`\n▌ ${COMPANIES[co]?.name.toUpperCase()}\n${'─'.repeat(28)}\n\n`;
    cj.forEach((j,idx)=>{
      const names=(j.empIds||[]).map(id=>empById(id)?.name||'?').join(' + ');
      body+=`${idx+1}. ${names}\n   Job     : ${j.jobType}\n   Customer: ${j.customer}\n   Address : ${j.address}\n`;
      if(j.phone)body+=`   Phone   : ${j.phone}\n`;
      body+=`   Time    : ${fmtTime(j.startTime)} – ${fmtTime(j.endTime)}\n`;
      const mats=parseMats(j.materials||'');
      if(mats.length){body+=`   Materials:\n`;mats.forEach(m=>body+=`     • ${m.item}${m.qty?' × '+m.qty:''}${m.unit?' '+m.unit:''}\n`)}
      if(j.notes)body+=`   Notes   : ${j.notes}\n`;
      body+='\n';
    });
  });
  return body+`${'─'.repeat(40)}\nSent by Nandwani Job Scheduler`;
}

function printReport(){
  const d2=document.getElementById('reportDate')?.value;if(!d2)return;
  const d=new Date(d2+'T00:00:00');
  const dj=jobs.filter(j=>j.date===d2).sort((a,b)=>a.startTime.localeCompare(b.startTime));
  const dateLabel=d.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const byC={};dj.forEach(j=>{const co=(empById((j.empIds||[])[0])?.company)||'handloom';if(!byC[co])byC[co]=[];byC[co].push(j)});
  let cardsHtml='';
  Object.entries(byC).forEach(([co,cj])=>{
    const c=COMPANIES[co];
    cardsHtml+=`<div class="section"><div class="sec-title" style="background:${c.color};color:white">${c.name}</div>`;
    cj.forEach(j=>{
      const names=(j.empIds||[]).map(id=>empById(id)?.name||'?').join(' + ');
      const mats=parseMats(j.materials||'');
      cardsHtml+=`<div class="job" style="border-left:4px solid ${c.color}">
        <div class="time">${fmtTime(j.startTime)} – ${fmtTime(j.endTime)}</div>
        <div class="job-title">${names} — ${j.jobType}</div>
        <div class="detail">👤 ${j.customer}${j.phone?' · 📞 '+j.phone:''}</div>
        <div class="detail">📍 ${j.address}</div>
        ${mats.length?`<div class="detail mats">📦 ${mats.map(m=>`${m.item}${m.qty?' × '+m.qty:''}${m.unit?' '+m.unit:''}`).join(' | ')}</div>`:''}
        ${j.notes?`<div class="detail notes">📝 ${j.notes}</div>`:''}
      </div>`;
    });
    cardsHtml+=`</div>`;
  });
  const w=window.open('','_blank','width=780,height=1050');
  w.document.write(`<!DOCTYPE html><html><head><title>Nandwani Report — ${dateLabel}</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>body{font-family:'DM Sans',sans-serif;font-size:15px;padding:32px 40px;color:#1a130a;line-height:1.6;max-width:720px;margin:0 auto}h1{font-size:24px;margin-bottom:5px}.date{color:#8a7d6a;font-size:14px;margin-bottom:7px}.summary{background:#f5f0e8;border-radius:8px;padding:12px 16px;margin-bottom:22px;font-size:16px;font-weight:700}.section{margin-bottom:24px}.sec-title{font-size:17px;font-weight:700;padding:9px 16px;margin-bottom:12px;border-radius:6px}.job{border-left:4px solid #ccc;padding:12px 16px;margin-bottom:12px;border-radius:0 8px 8px 0;background:#faf7f2}.time{font-size:13px;color:#9a7230;font-family:monospace;margin-bottom:5px;font-weight:700}.job-title{font-size:17px;font-weight:800;margin-bottom:7px}.detail{font-size:14px;color:#3d3020;margin-bottom:3px}.mats{color:#6a5d4e}.notes{color:#8a7d6a;font-style:italic}@media print{body{padding:16px 20px}}</style></head>
  <body><h1>Nandwani Group — Daily Report</h1><div class="date">${dateLabel}</div><div class="summary">${dj.length} Job${dj.length!==1?'s':''} Scheduled</div>${cardsHtml||'<p style="color:#8a7d6a">No jobs scheduled.</p>'}</body></html>`);
  w.document.close();setTimeout(()=>{w.focus();w.print()},500);
}

function copyReport(){
  const d2=document.getElementById('reportDate')?.value||ds(new Date());
  navigator.clipboard.writeText(genEmailBody(new Date(d2+'T00:00:00'))).then(()=>toast(T('Copied!'),'success'));
}
